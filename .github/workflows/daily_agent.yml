name: Daily Sourcing Agent

on:
  # === SCHEDULE STILL PAUSED ===
  # Paused 2026-06-26 (#56) for suspected SAP bot detection. #63 found no
  # evidence of a block: 80 identical login failures, no captcha/403/429,
  # and the account turned out to be a SHARED login, since replaced with a
  # unique one.
  #
  # Staying paused until one manual `workflow_dispatch` run confirms SAP
  # logs in with the new credentials. The times below are the agreed 8 AM
  # schedule, ready to go — re-enable by uncommenting the schedule block.
  #
  # GitHub cron is always UTC and does NOT follow daylight saving, so a
  # fixed UTC time drifts by an hour twice a year. 12:00 UTC is:
  #   8:00 AM ET from mid-March to early November (EDT, ~8 months)
  #   7:00 AM ET from early November to mid-March (EST, ~4 months)
  # Anchored to EDT because that covers most of the year. Use '0 13' instead
  # to anchor to EST (9:00 AM in summer, 8:00 AM in winter).
  #
  # schedule:
  #   # Weekdays — daily mode
  #   - cron: '0 12 * * 1-5'
  #   # Saturday — weekly mode (Open + Goods + last 7 days)
  #   - cron: '0 12 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # Bumped from 30 to 60 — three of the last six scheduled runs hit
    # the 30-min ceiling and were killed mid-flight, leaving tenders
    # in the DB without corresponding run_history checkpoints.
    # Successful runs have stayed under 28 minutes, so 60 leaves
    # comfortable headroom while still acting as a kill switch on a
    # genuinely stuck run.
    timeout-minutes: 60

    steps:
      - name: Record start time
        run: echo "WORKFLOW_START=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: processed_dashboard.json
          key: dashboard-state-v4-${{ github.run_id }}
          restore-keys: dashboard-state-v4-

      - name: Run agent
        env:
          WORKFLOW_START: ${{ env.WORKFLOW_START }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAP_USERNAME: ${{ secrets.SAP_USERNAME }}
          SAP_PASSWORD: ${{ secrets.SAP_PASSWORD }}
          CFLOW_BASE_URL: ${{ secrets.CFLOW_BASE_URL }}
          CFLOW_API_KEY: ${{ secrets.CFLOW_API_KEY }}
          CFLOW_USER_KEY: ${{ secrets.CFLOW_USER_KEY }}
          CFLOW_USERNAME: ${{ secrets.CFLOW_USERNAME }}
          CFLOW_WORKFLOW_NAME: ${{ secrets.CFLOW_WORKFLOW_NAME }}
          CFLOW_SUBMIT_NOW: 'false'
        run: |
          # Determine mode: manual input > Saturday auto-detect > daily default
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "$(date -u +%u)" = "6" ]; then
            MODE="weekly"
          else
            MODE="daily"
          fi
          echo "Running in $MODE mode"
          # Always pass the mode explicitly. The agent has its own Saturday
          # auto-detect for bare local runs; letting both decide meant a
          # manual "daily" dispatch on a Saturday silently ran weekly.
          if [ "$MODE" = "weekly" ]; then
            python run.py --weekly
          else
            python run.py --daily
          fi

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: agent.log
          retention-days: 30

      # Screenshots + page dumps captured whenever an SAP step fails. This is
      # the evidence that was missing for the 80 consecutive login failures
      # between 2026-06-09 and 2026-06-26. Shorter retention than the log
      # because screenshots of the login page are heavier and more sensitive.
      - name: Upload SAP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sap-diagnostics-${{ github.run_id }}
          path: sap_diagnostics/
          retention-days: 14
          if-no-files-found: ignore

      - name: Push updated dashboard data to main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update dashboard data [skip ci]"
          git pull --rebase origin main || true
          git push origin main
